; frunk.store's settings for Prince of Persia in the car's browser. The
; page keeps the player's own choices (the pause menu's Settings) in
; SDLPoP.cfg next to the saves; this file only sets the starting point.
[General]
enable_pause_menu = true
enable_copyprot = false
enable_music = true
enable_fade = true
enable_flash = true
enable_text = true
; no "press any key" splash: the page has its own start screen
enable_info_screen = false
start_fullscreen = false
; the original drew 320x200 on a 4:3 screen
use_correct_aspect_ratio = true
use_integer_scaling = false
scaling_type = sharp
enable_controller_rumble = false
levelset = original
[AdditionalFeatures]
enable_quicksave = true
enable_quicksave_penalty = true
; no replay recording: nothing in the car reads .p1r files
enable_replay = false
enable_lighting = false
[Enhancements]
use_fixes_and_enhancements = true
; (a closing comment: the ini reader warns of a "short read" when a value is the last line)
