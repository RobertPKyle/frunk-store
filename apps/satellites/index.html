<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Satellite Tracker</title>
<style>
  :root { --bg: #02040a; --panel: #0b1120; --card: #111a2e; --line: rgba(140, 170, 230, .16); --text: #dbe3f2; --muted: #8590a6; --accent: #8fb4ff; --sat: #ffe08a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { min-height: 44px; padding: 8px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 1fr 350px; height: 100%; }
  .skybox { position: relative; min-width: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #live { position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: var(--muted); }
  #red { position: fixed; inset: 0; background: #ff2a10; mix-blend-mode: multiply; pointer-events: none; z-index: 10; }
  #red[hidden] { display: none; }
  .tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  #tip { position: absolute; padding: 6px 10px; border-radius: 10px; background: rgba(10, 14, 24, .9); border: 1px solid var(--line); font-size: 14px; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); max-width: 300px; }
  #tip[hidden] { display: none; }
  .btn[aria-pressed="true"] { border-color: #ff6b5a; color: #ff8a7a; }

  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  .head { display: flex; gap: 6px; padding: 8px; }
  #placeBtn { flex: 1; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  #hero { margin: 0 8px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(135deg, #18284d, #111a2e); border: 1px solid var(--line); }
  #hero .k { font-size: 13px; color: var(--muted); }
  #hero .big { font-size: 22px; font-weight: 600; margin: 2px 0; }
  #hero .sub { font-size: 14px; }
  .chips { display: flex; gap: 6px; padding: 8px; }
  .chip { flex: 1; min-height: 40px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
  .chip[aria-pressed="true"] { background: #2a3f6e; border-color: var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 0 8px 8px; overscroll-behavior: contain; }
  #list h3 { margin: 10px 4px 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pass { display: grid; grid-template-columns: 74px 1fr auto; gap: 2px 8px; align-items: baseline; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .pass[aria-pressed="true"] { border-color: var(--sat); background: #1d2433; }
  .pass .when { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pass .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pass .alt { color: var(--sat); font-variant-numeric: tabular-nums; }
  .pass .how { grid-column: 2 / 4; color: var(--muted); font-size: 13px; }
  .pass.now { border-color: #7ee2a8; }
  #msg { padding: 14px; color: var(--muted); font-size: 14px; }
  #msg:empty { display: none; }
  footer { padding: 6px 10px 8px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46% 54%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="skybox">
    <canvas id="sky"></canvas>
    <div class="tools">
      <button class="btn" id="redBtn" type="button" aria-pressed="false">Night vision</button>
    </div>
    <div id="live"></div>
    <div id="tip" hidden></div>
  </div>
  <aside>
    <div class="head">
      <button class="btn" id="placeBtn" type="button">Set location</button>
      <button class="btn" id="refreshBtn" type="button" aria-label="Refresh orbit data">↻</button>
    </div>
    <div id="hero"><div class="k">Loading orbit data…</div></div>
    <div class="chips" role="group" aria-label="Which satellites">
      <button class="chip" type="button" data-filter="highlights" aria-pressed="true">Highlights</button>
      <button class="chip" type="button" data-filter="all" aria-pressed="false">All bright</button>
    </div>
    <div id="msg"></div>
    <div id="list"></div>
    <footer id="foot">Orbit data from CelesTrak · Times in this car's time zone</footer>
  </aside>
</div>
<div id="red" hidden></div>
<script type="module" src="sats.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
