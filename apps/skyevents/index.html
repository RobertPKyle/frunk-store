<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sky Events</title>
<style>
  :root { --bg: #070a14; --panel: #0d1222; --card: #121a2e; --line: rgba(150, 170, 230, .16); --text: #e0e6f2; --muted: #8a94aa; --accent: #a99bff;
          --moon: #e9e3cc; --meteor: #7fc8ff; --planet: #ffc46b; --eclipse: #ff8a6b; --season: #8fe0a0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { min-height: 44px; padding: 8px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; height: 100%; }
  /* left padding keeps clear of the hub's Apps button */
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 110px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 14px; }
  #placeBtn { max-width: 45%; overflow: hidden; text-overflow: ellipsis; }

  #tonight { overflow-y: auto; padding: 10px; border-right: 1px solid var(--line); background: var(--panel); overscroll-behavior: contain; }
  #tonight h2, .month { margin: 4px 2px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .moonbox { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; }
  .moonbox svg { flex: none; }
  .moonbox b { display: block; font-size: 18px; }
  .moonbox span { display: block; font-size: 14px; color: var(--muted); }
  .pl { padding: 8px 10px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 6px; font-size: 14px; }
  .pl b { font-size: 16px; color: var(--planet); }
  .pl.off { opacity: .55; }
  .pl.off b { color: var(--text); }
  .pl span { display: block; color: var(--muted); }

  .right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .chips { display: flex; gap: 6px; padding: 8px; overflow-x: auto; }
  .chip { flex: 1; min-height: 40px; padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: #2c2a5c; border-color: var(--accent); }
  #list { flex: 1; overflow-y: auto; padding: 0 8px 12px; overscroll-behavior: contain; }
  .month { margin: 14px 4px 6px; }
  .ev { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 10px; margin-bottom: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .ev.big { border-color: rgba(169, 155, 255, .45); }
  .date { text-align: center; line-height: 1.1; }
  .date small { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .date b { display: block; font-size: 24px; font-weight: 600; }
  .date svg { margin-top: 4px; }
  .ev h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .when { font-size: 14px; color: var(--muted); margin-top: 1px; }
  .ev p { margin: 4px 0 0; font-size: 14px; line-height: 1.45; }
  .badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; vertical-align: 2px; background: #2a3044; color: var(--muted); }
  .badge.good { background: #1d4a35; color: #8fe0a0; }
  .badge.poor { background: #3f2a2a; color: #ff9f8a; }
  #msg { padding: 20px; color: var(--muted); text-align: center; }
  #msg:empty { display: none; }
  footer { padding: 6px 10px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    header { grid-column: 1; }
    #tonight { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sky Events <small id="range"></small></h1>
    <button class="btn" id="placeBtn" type="button">Set location</button>
  </header>
  <section id="tonight" aria-label="Tonight"></section>
  <div class="right">
    <div class="chips" role="group" aria-label="Show">
      <button class="chip" type="button" data-filter="all" aria-pressed="true">Highlights</button>
      <button class="chip" type="button" data-filter="meteor" aria-pressed="false">Meteors</button>
      <button class="chip" type="button" data-filter="moon" aria-pressed="false">Moon</button>
      <button class="chip" type="button" data-filter="planet" aria-pressed="false">Planets</button>
      <button class="chip" type="button" data-filter="eclipse" aria-pressed="false">Eclipses</button>
    </div>
    <div id="msg">Working out the sky…</div>
    <div id="list"></div>
    <footer>Computed on this screen. Times in this car's time zone. Solar eclipse paths from NASA (Espenak). Meteor rates are for a dark site.</footer>
  </div>
</div>
<script type="module" src="skyevents.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
