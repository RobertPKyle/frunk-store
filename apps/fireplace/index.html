<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Campfire</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8dccb; font: 16px system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .controls {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; padding: 8px;
    background: rgba(12, 9, 7, .72); border: 1px solid rgba(255, 190, 120, .16); border-radius: 16px;
    transition: opacity .4s;
  }
  .controls.hide { opacity: 0; pointer-events: none; }
  button { font: inherit; color: inherit; white-space: nowrap; min-height: 48px; padding: 8px 18px; border-radius: 12px; border: 1px solid rgba(255, 190, 120, .2); background: rgba(40, 28, 20, .8); cursor: pointer; }
  button[aria-pressed="true"] { border-color: #e0a24a; color: #ffcf8a; }
  input[type=range] { width: 160px; accent-color: #e0a24a; height: 32px; }
  #fps { position: fixed; top: 10px; right: 12px; font-size: 12px; color: rgba(255, 220, 180, .35); }
  #error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps"></div>
<div class="controls" id="controls">
  <button id="sound" type="button" aria-pressed="false">Sound off</button>
  <input id="volume" type="range" min="0.05" max="1" step="0.01" value="0.7" aria-label="Fire volume">
  <button id="crickets" type="button" aria-pressed="false">Crickets</button>
</div>
<div id="error" hidden></div>
<script type="module" src="fire.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
