<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Browser Probe</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #171a1f; --line: #2a2f37; --text: #e8eaed; --muted: #8b93a1;
    --ok: #3ecf8e; --bad: #f2555a; --warn: #f5b445; --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.4 system-ui, sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; flex: 1; }
  button { font: inherit; font-size: 20px; padding: 14px 24px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; min-height: 56px; }
  button.secondary { background: var(--line); color: var(--text); }
  main { padding: 16px 24px 48px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; word-break: break-word; }
  td:first-child { color: var(--muted); width: 45%; padding-right: 12px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  #pads { min-height: 40px; margin-top: 12px; white-space: pre-line; }
  .pad { display: flex; align-items: center; justify-content: center; gap: 36px; padding: 16px; border-radius: 40px; background: #22262d; max-width: 520px; }
  .pad i { display: block; background: #3a404a; border-radius: 6px; font-style: normal; font-size: 14px; color: var(--muted); text-align: center; }
  .pad i.on { background: var(--ok); color: #062014; }
  .dpad { display: grid; grid-template: repeat(3, 34px) / repeat(3, 34px); }
  .dpad [data-k=up] { grid-area: 1 / 2; } .dpad [data-k=left] { grid-area: 2 / 1; }
  .dpad [data-k=right] { grid-area: 2 / 3; } .dpad [data-k=down] { grid-area: 3 / 2; }
  .mid { display: flex; gap: 12px; } .mid i { padding: 6px 12px; border-radius: 999px; }
  .face { display: flex; gap: 14px; } .face i { width: 52px; height: 52px; line-height: 52px; border-radius: 50%; font-size: 18px; font-weight: 700; }
  .log { margin-top: 8px; font-size: 14px; color: var(--muted); }
  #qr { background: #fff; padding: 12px; display: inline-block; border-radius: 8px; }
  #status { color: var(--muted); }
  @media (max-width: 480px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Tesla Browser Probe</h1>
  <span id="status">Running…</span>
  <button id="bench">Run benchmarks</button>
  <button id="qrBtn" class="secondary">Show QR of results</button>
</header>
<main id="out"></main>
<div style="padding:0 24px 48px">
  <section>
    <h2>Controller (connect it, then press any button)</h2>
    <div class="pad" aria-hidden="true">
      <div class="dpad"><i data-k="up"></i><i data-k="left"></i><i data-k="right"></i><i data-k="down"></i></div>
      <div class="mid"><i data-k="select">Select</i><i data-k="start">Start</i></div>
      <div class="face"><i data-k="b">B</i><i data-k="a">A</i></div>
    </div>
    <div id="pads">No controller seen yet. Press a button after it connects.</div>
    <div id="padLog" class="log"></div>
  </section>
  <section style="margin-top:16px">
    <h2>Files (plug in a USB drive, then pick a file or a folder)</h2>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button id="pickFile" type="button">Pick a file</button>
      <button id="pickFolder" type="button" class="secondary">Pick a folder</button>
    </div>
    <input id="fileInput" type="file" multiple hidden>
    <input id="folderInput" type="file" webkitdirectory multiple hidden>
    <div id="files" style="margin-top:12px;color:var(--muted)">Nothing picked yet.</div>
  </section>
  <section style="margin-top:16px">
    <h2>Results JSON (photograph or scan QR)</h2>
    <div id="qrWrap" hidden><div id="qr"></div></div>
    <pre id="json" style="white-space:pre-wrap;font-size:13px;color:var(--muted)"></pre>
  </section>
</div>

<!-- Served same-origin so COEP require-corp doesn't block it -->
<script src="qrcode.min.js"></script>
<script>
const results = {};
const out = document.getElementById('out');

function render() {
  out.innerHTML = '';
  for (const [group, rows] of Object.entries(results)) {
    const s = document.createElement('section');
    s.innerHTML = `<h2>${group}</h2>`;
    const t = document.createElement('table');
    for (const [k, v] of Object.entries(rows)) {
      const tr = t.insertRow();
      tr.insertCell().textContent = k;
      const c = tr.insertCell();
      if (v === true) { c.textContent = 'yes'; c.className = 'ok'; }
      else if (v === false) { c.textContent = 'no'; c.className = 'bad'; }
      else c.textContent = String(v);
    }
    s.appendChild(t);
    out.appendChild(s);
  }
  document.getElementById('json').textContent = JSON.stringify(results, null, 1);
}

function set(group, key, value) {
  (results[group] ||= {})[key] = value;
}

async function safe(group, key, fn) {
  try { set(group, key, await fn()); }
  catch (e) { set(group, key, 'error: ' + (e && e.message || e)); }
}

async function probe() {
  // Identity
  const ua = navigator.userAgent;
  set('Identity', 'userAgent', ua);
  set('Identity', 'Chromium version', (ua.match(/Chrome\/([\d.]+)/) || [])[1] || 'unknown');
  set('Identity', 'Tesla token in UA', /Tesla/i.test(ua));
  set('Identity', 'platform', navigator.platform);
  set('Identity', 'hardwareConcurrency', navigator.hardwareConcurrency);
  set('Identity', 'deviceMemory (GB)', navigator.deviceMemory ?? 'n/a');
  await safe('Identity', 'UA-CH platform', async () => {
    if (!navigator.userAgentData) return 'n/a';
    const d = await navigator.userAgentData.getHighEntropyValues(['platform', 'platformVersion', 'architecture', 'fullVersionList']);
    return `${d.platform} ${d.platformVersion} ${d.architecture} | ${(d.fullVersionList || []).map(b => b.brand + ' ' + b.version).join(', ')}`;
  });

  // Display / input
  set('Display & input', 'screen', `${screen.width}x${screen.height}`);
  set('Display & input', 'viewport', `${innerWidth}x${innerHeight}`);
  set('Display & input', 'devicePixelRatio', devicePixelRatio);
  set('Display & input', 'maxTouchPoints', navigator.maxTouchPoints);
  set('Display & input', 'pointer: coarse', matchMedia('(pointer: coarse)').matches);
  set('Display & input', 'hover: hover', matchMedia('(hover: hover)').matches);
  set('Display & input', 'prefers dark', matchMedia('(prefers-color-scheme: dark)').matches);
  set('Display & input', 'Fullscreen API', !!document.documentElement.requestFullscreen);
  set('Display & input', 'Screen Orientation API', !!screen.orientation);
  set('Display & input', 'Keyboard Lock API', !!(navigator.keyboard && navigator.keyboard.lock));
  set('Display & input', 'Pointer Lock', 'requestPointerLock' in document.documentElement);

  // Graphics
  const c = document.createElement('canvas');
  const gl2 = c.getContext('webgl2');
  const gl = gl2 || document.createElement('canvas').getContext('webgl');
  set('Graphics', 'WebGL 1', !!(gl2 || document.createElement('canvas').getContext('webgl')));
  set('Graphics', 'WebGL 2', !!gl2);
  if (gl) {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    set('Graphics', 'GPU vendor', dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR));
    set('Graphics', 'GPU renderer', dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    set('Graphics', 'MAX_TEXTURE_SIZE', gl.getParameter(gl.MAX_TEXTURE_SIZE));
  }
  await safe('Graphics', 'WebGPU adapter', async () => {
    if (!navigator.gpu) return false;
    const a = await navigator.gpu.requestAdapter();
    return a ? (a.info ? `${a.info.vendor} ${a.info.architecture}`.trim() || true : true) : 'API present, no adapter';
  });
  set('Graphics', 'OffscreenCanvas', typeof OffscreenCanvas !== 'undefined');

  // Compute
  set('Compute', 'WebAssembly', typeof WebAssembly === 'object');
  // Minimal module using a v128 SIMD instruction
  set('Compute', 'WASM SIMD', (() => { try { return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11])); } catch { return false; } })());
  set('Compute', 'SharedArrayBuffer', typeof SharedArrayBuffer !== 'undefined');
  set('Compute', 'crossOriginIsolated', !!self.crossOriginIsolated);
  set('Compute', 'Web Workers', typeof Worker !== 'undefined');

  // Storage / offline
  set('Storage & offline', 'localStorage', (() => { try { localStorage.setItem('_p', '1'); localStorage.removeItem('_p'); return true; } catch { return false; } })());
  set('Storage & offline', 'IndexedDB', !!self.indexedDB);
  set('Storage & offline', 'Service Worker', 'serviceWorker' in navigator);
  set('Storage & offline', 'Cache API', 'caches' in self);
  await safe('Storage & offline', 'quota estimate', async () => {
    if (!navigator.storage?.estimate) return 'n/a';
    const e = await navigator.storage.estimate();
    return `${(e.usage / 1e6).toFixed(1)} MB used / ${(e.quota / 1e6).toFixed(0)} MB quota`;
  });
  await safe('Storage & offline', 'persisted storage', async () => navigator.storage?.persisted ? await navigator.storage.persisted() : 'n/a');
  set('Storage & offline', 'PWA install prompt seen', false);
  addEventListener('beforeinstallprompt', () => { set('Storage & offline', 'PWA install prompt seen', true); render(); });

  // Media
  set('Media', 'Web Audio', typeof AudioContext !== 'undefined');
  set('Media', 'MediaSource', typeof MediaSource !== 'undefined');
  if (typeof MediaSource !== 'undefined') {
    for (const [name, mime] of [['H.264', 'video/mp4; codecs="avc1.42E01E"'], ['VP9', 'video/webm; codecs="vp9"'], ['AV1', 'video/mp4; codecs="av01.0.05M.08"'], ['AAC', 'audio/mp4; codecs="mp4a.40.2"'], ['Opus', 'audio/webm; codecs="opus"']])
      set('Media', name, MediaSource.isTypeSupported(mime));
  }
  set('Media', 'EME (DRM)', !!navigator.requestMediaKeySystemAccess);
  await safe('Media', 'Widevine', async () => {
    if (!navigator.requestMediaKeySystemAccess) return false;
    await navigator.requestMediaKeySystemAccess('com.widevine.alpha', [{ videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.42E01E"' }] }]);
    return true;
  });
  set('Media', 'Speech synthesis', 'speechSynthesis' in self);
  set('Media', 'Speech recognition', 'webkitSpeechRecognition' in self || 'SpeechRecognition' in self);
  set('Media', 'getUserMedia', !!navigator.mediaDevices?.getUserMedia);

  // Network / devices
  set('Network & devices', 'WebSocket', typeof WebSocket !== 'undefined');
  set('Network & devices', 'WebRTC', typeof RTCPeerConnection !== 'undefined');
  set('Network & devices', 'WebTransport', typeof WebTransport !== 'undefined');
  set('Network & devices', 'connection type', navigator.connection ? `${navigator.connection.effectiveType} ~${navigator.connection.downlink}Mbps` : 'n/a');
  set('Network & devices', 'Gamepad API', 'getGamepads' in navigator);
  set('Controller', 'Gamepad API', 'getGamepads' in navigator);
  set('Network & devices', 'Geolocation API', 'geolocation' in navigator);
  set('Network & devices', 'Web Bluetooth', 'bluetooth' in navigator);
  set('Network & devices', 'WebUSB', 'usb' in navigator);
  set('Network & devices', 'Notifications', 'Notification' in self);
  set('Network & devices', 'Clipboard write', !!navigator.clipboard?.writeText);
  set('Network & devices', 'Vibration', 'vibrate' in navigator);
  set('Files', 'File input', (() => { const i = document.createElement('input'); i.type = 'file'; return i.type === 'file' && !i.disabled; })());
  set('Files', 'Folder picking (webkitdirectory)', 'webkitdirectory' in document.createElement('input'));
  set('Files', 'File System Access API', typeof showOpenFilePicker === 'function');

  render();
  document.getElementById('status').textContent = 'Probe done. Tap "Run benchmarks" while parked.';
}

// Benchmarks: rough single-thread JS score, canvas 2D FPS, WebGL FPS
async function runBenchmarks() {
  const btn = document.getElementById('bench');
  btn.disabled = true;
  document.getElementById('status').textContent = 'Benchmarking…';

  // JS: fixed integer + float workload, report ms (lower is better)
  const t0 = performance.now();
  let x = 0;
  for (let i = 0; i < 2e7; i++) x = (x + Math.sqrt(i) * 1.0001) % 1e9;
  set('Benchmarks', 'JS loop 2e7 (ms, lower better)', Math.round(performance.now() - t0) + (x < 0 ? '' : ''));

  set('Benchmarks', 'Canvas 2D FPS (2000 sprites)', await fpsTest(canvas2dFrame()));
  set('Benchmarks', 'WebGL FPS (50k triangles)', await fpsTest(webglFrame()));

  render();
  document.getElementById('status').textContent = 'Benchmarks done.';
  btn.disabled = false;
}

function fpsTest(drawFrame, seconds = 3) {
  return new Promise(resolve => {
    if (!drawFrame) return resolve('n/a');
    let frames = 0; const start = performance.now();
    (function loop(now) {
      drawFrame(now); frames++;
      if (now - start < seconds * 1000) requestAnimationFrame(loop);
      else { drawFrame.cleanup?.(); resolve(Math.round(frames / ((now - start) / 1000))); }
    })(start);
  });
}

function overlayCanvas() {
  const cv = document.createElement('canvas');
  cv.width = innerWidth; cv.height = innerHeight;
  Object.assign(cv.style, { position: 'fixed', inset: 0, zIndex: 9 });
  document.body.appendChild(cv);
  return cv;
}

function canvas2dFrame() {
  const cv = overlayCanvas(); const ctx = cv.getContext('2d');
  const sprites = Array.from({ length: 2000 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, vx: Math.random() * 4 - 2, vy: Math.random() * 4 - 2, h: Math.random() * 360 }));
  const f = () => {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (const s of sprites) {
      s.x = (s.x + s.vx + cv.width) % cv.width; s.y = (s.y + s.vy + cv.height) % cv.height;
      ctx.fillStyle = `hsl(${s.h},80%,60%)`; ctx.fillRect(s.x, s.y, 8, 8);
    }
  };
  f.cleanup = () => cv.remove();
  return f;
}

function webglFrame() {
  const cv = overlayCanvas(); const gl = cv.getContext('webgl');
  if (!gl) { cv.remove(); return null; }
  const vs = 'attribute vec2 p; uniform float t; void main(){ float a=t+p.x*3.0; gl_Position=vec4(p.x*cos(a)-p.y*sin(a)*0.5, p.y*cos(a)+p.x*sin(a)*0.5, 0.0, 1.0); }';
  const fs = 'precision mediump float; uniform float t; void main(){ gl_FragColor=vec4(0.5+0.5*sin(t),0.4,0.8,0.15); }';
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh); gl.attachShader(prog, sh);
  }
  gl.linkProgram(prog); gl.useProgram(prog);
  const n = 50000 * 3, data = new Float32Array(n * 2);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tLoc = gl.getUniformLocation(prog, 't');
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  const f = now => { gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(tLoc, now / 1000); gl.drawArrays(gl.TRIANGLES, 0, n); };
  f.cleanup = () => cv.remove();
  return f;
}

// Controller tester. Shows which NES-style button each press lights up and
// logs raw button numbers and keys, so we can learn how a controller maps.
// Covers the Gamepad API (standard mapping or not, with the D-pad on buttons
// or on axes) and keyboard mode, which some controllers offer instead.
const padLog = [];
const buttonsSeen = new Set(), keysSeen = new Set();
const lit = new Set();
function logPad(text) {
  padLog.unshift(text);
  padLog.length = Math.min(padLog.length, 8);
  document.getElementById('padLog').textContent = padLog.join(' · ');
}
function light(keys) {
  for (const el of document.querySelectorAll('.pad i')) el.classList.toggle('on', keys.has(el.dataset.k));
}

// The car adds a "Tesla Virtual Gamepad" (standard layout) for a controller
// it recognises, next to the controller's own raw device, and both report
// every press under different numbers: an 8BitDo Zero 2's A is raw button 0
// but standard button 1. So when any standard pad is present, buttons come
// only from standard pads; raw pads add only D-pad directions from their
// axes, which agree with the standard pad. Without a standard pad, raw pads
// are read with the usual raw layout (A 0, B 1, Select 10, Start 11).
function padsToPlayers(pads) {
  const players = [new Set(), new Set()];
  const standard = pads.filter(p => p.mapping === 'standard');
  const raw = pads.filter(p => p.mapping !== 'standard');
  (standard.length ? standard : raw).slice(0, 2).forEach((p, i) => readPad(p, players[i]));
  if (standard.length) for (const p of raw) padAxes(p, players[0]);
  return players;
}

function padAxes(p, out) {
  const ax = p.axes;
  if (ax[1] < -0.5) out.add('up');
  if (ax[1] > 0.5) out.add('down');
  if (ax[0] < -0.5) out.add('left');
  if (ax[0] > 0.5) out.add('right');
}

function readPad(p, out) {
  const on = i => p.buttons[i] && p.buttons[i].pressed;
  padAxes(p, out);
  if (p.mapping === 'standard') {
    if (on(12)) out.add('up');
    if (on(13)) out.add('down');
    if (on(14)) out.add('left');
    if (on(15)) out.add('right');
    // Bottom face button is NES B, right face button is NES A
    if (on(1) || on(3)) out.add('a');
    if (on(0) || on(2)) out.add('b');
    if (on(8)) out.add('select');
    if (on(9)) out.add('start');
  } else {
    if (on(0)) out.add('a');
    if (on(1)) out.add('b');
    if (on(10)) out.add('select');
    if (on(11)) out.add('start');
  }
}

const prevPressed = new Map();
function pollPads() {
  const pads = [...(navigator.getGamepads?.() || [])].filter(Boolean);
  const keys = new Set(lit);
  const lines = [];
  for (const p of pads) {
    const pressed = p.buttons.map((b, i) => b.pressed ? i : null).filter(i => i !== null);
    const before = prevPressed.get(p.index) || [];
    for (const i of pressed) if (!before.includes(i)) { buttonsSeen.add(i); logPad(`pad ${p.index} button ${i}`); }
    prevPressed.set(p.index, pressed);
    const ax = p.axes;
    const role = pads.some(q => q.mapping === 'standard') && p.mapping !== 'standard' ? ' (D-pad only: the car mirrors it as a standard pad)' : '';
    lines.push(`pad ${p.index}: ${p.id}${role} — mapping: ${p.mapping || 'none'}, ${p.buttons.length} buttons, ${ax.length} axes [${ax.map(a => a.toFixed(2)).join(', ')}]`);
  }
  for (const b of padsToPlayers(pads)[0]) keys.add(b);
  if (pads.length) {
    document.getElementById('pads').textContent = lines.join('\n');
    set('Controller', 'Gamepad seen', pads.map(p => p.id).join(' | '));
    set('Controller', 'Mapping', pads.map(p => p.mapping || 'none').join(' | '));
  }
  light(keys);
  requestAnimationFrame(pollPads);
}
addEventListener('gamepadconnected', e => { logPad(`connected: ${e.gamepad.id}`); set('Controller', 'Gamepad seen', e.gamepad.id); render(); });
addEventListener('gamepaddisconnected', e => { logPad(`disconnected: ${e.gamepad.id}`); });

// Keyboard mode: arrows for the D-pad; common choices for the buttons
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'start', ShiftRight: 'select', ShiftLeft: 'select', Space: 'select', KeyX: 'a', KeyK: 'a', KeyZ: 'b', KeyJ: 'b' };
addEventListener('keydown', e => {
  if (e.repeat) return;
  keysSeen.add(e.code || e.key);
  logPad(`key ${e.key} (${e.code})`);
  if (KEYMAP[e.code]) { lit.add(KEYMAP[e.code]); e.preventDefault(); }
  set('Controller', 'Keys seen', [...keysSeen].join(' '));
  render();
});
addEventListener('keyup', e => lit.delete(KEYMAP[e.code]));
setInterval(() => { if (buttonsSeen.size) { set('Controller', 'Buttons seen', [...buttonsSeen].sort((a, b) => a - b).join(' ')); render(); } }, 1000);

// File picker: does the car's browser open a chooser, can it see a USB
// drive, and can the page read what was picked? Files are read here only.
async function describe(file) {
  const head = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  const nes = head[0] === 0x4e && head[1] === 0x45 && head[2] === 0x53 && head[3] === 0x1a;
  return `${file.webkitRelativePath || file.name} · ${(file.size / 1024).toFixed(1)} KB` + (nes ? ' · iNES header OK' : '');
}

async function picked(input, label) {
  const files = [...input.files];
  const el = document.getElementById('files');
  if (!files.length) { set('Files', label, 'chooser opened, nothing picked'); render(); return; }
  try {
    const lines = await Promise.all(files.slice(0, 20).map(describe));
    set('Files', label, `${files.length} file(s), read OK`);
    set('Files', 'iNES files seen', lines.filter(l => l.includes('iNES')).length);
    el.replaceChildren(...lines.map(l => Object.assign(document.createElement('div'), { textContent: l })),
      ...(files.length > 20 ? [Object.assign(document.createElement('div'), { textContent: `…and ${files.length - 20} more` })] : []));
  } catch (e) {
    set('Files', label, 'picked, but reading failed: ' + (e && e.message || e));
  }
  render();
}

function pickWith(id, label) {
  const input = document.getElementById(id);
  set('Files', label, 'tapped, waiting for chooser…');
  render();
  input.value = '';
  input.onchange = () => picked(input, label);
  input.oncancel = () => { set('Files', label, 'chooser opened, then cancelled'); render(); };
  input.click();
}

document.getElementById('pickFile').onclick = () => pickWith('fileInput', 'Pick a file');
document.getElementById('pickFolder').onclick = () => pickWith('folderInput', 'Pick a folder');

// Compact summary for QR: key facts only, so it fits in one code
function showQr() {
  const g = k => Object.assign({}, ...Object.values(results).map(r => r))[k];
  const summary = {
    ua: g('userAgent'), gpu: g('GPU renderer'), cores: g('hardwareConcurrency'), vp: g('viewport'), dpr: g('devicePixelRatio'),
    gl2: g('WebGL 2'), gpu2: g('WebGPU adapter'), simd: g('WASM SIMD'), sab: g('SharedArrayBuffer'), sw: g('Service Worker'),
    quota: g('quota estimate'), pad: g('Gamepad API'), padSeen: g('Gamepad seen'), padMap: g('Mapping'), btns: g('Buttons seen'), keys: g('Keys seen'), wv: g('Widevine'), h264: g('H.264'),
    file: g('Pick a file'), folder: g('Pick a folder'), nes: g('iNES files seen'),
    js: g('JS loop 2e7 (ms, lower better)'), fps2d: g('Canvas 2D FPS (2000 sprites)'), fpsgl: g('WebGL FPS (50k triangles)'),
  };
  const wrap = document.getElementById('qrWrap');
  const qr = document.getElementById('qr');
  qr.innerHTML = '';
  wrap.hidden = false;
  if (typeof QRCode === 'undefined') { qr.textContent = 'QR library failed to load.'; return; }
  new QRCode(qr, { text: JSON.stringify(summary), width: 360, height: 360, correctLevel: QRCode.CorrectLevel.L });
  wrap.scrollIntoView();
}
