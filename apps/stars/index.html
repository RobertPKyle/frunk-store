<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Map</title>
<style>
  :root { --panel: rgba(10, 14, 24, .86); --line: rgba(140, 170, 230, .18); --text: #d6deee; --muted: #8590a6; --accent: #8fb4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02040a; color: var(--text); font: 16px/1.4 system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

  .top { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; }
  .btn { min-height: 44px; padding: 8px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .btn[aria-pressed="true"] { border-color: #ff6b5a; color: #ff8a7a; }

  .bottom { position: fixed; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .bottom input { flex: 1; min-width: 80px; accent-color: var(--accent); height: 32px; }
  #when { min-width: 120px; font-variant-numeric: tabular-nums; color: var(--accent); }

  #tip { position: fixed; padding: 6px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); white-space: nowrap; }
  #tip[hidden] { display: none; }

  #picker { position: fixed; inset: 0; background: rgba(2, 4, 10, .92); display: flex; flex-direction: column; padding: 60px 20px 20px; gap: 12px; z-index: 5; }
  #picker[hidden] { display: none; }
  #picker h2 { margin: 0; font-size: 20px; }
  #picker .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #geoStatus { color: var(--muted); font-size: 14px; }
  #cities { flex: 1; overflow: auto; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); align-content: start; }
  #cities button { min-height: 48px; padding: 8px 12px; border-radius: 12px; background: #0d1322; border: 1px solid var(--line); text-align: left; }

  /* Night vision: keep only the red channel of everything on screen */
  #red { position: fixed; inset: 0; background: #ff2a10; mix-blend-mode: multiply; pointer-events: none; z-index: 10; }
  #red[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="top">
  <button class="btn" id="placeBtn" type="button">Set location</button>
  <button class="btn" id="redBtn" type="button" aria-pressed="false">Night vision</button>
</div>

<div class="bottom">
  <button class="btn" id="nowBtn" type="button">Now</button>
  <input id="hours" type="range" min="0" max="720" step="10" value="0" aria-label="Time offset from now, minutes">
  <span id="when">Now</span>
  <button class="btn" id="zoomOut" type="button" aria-label="Zoom out">−</button>
  <button class="btn" id="zoomIn" type="button" aria-label="Zoom in">+</button>
</div>

<div id="tip" hidden></div>

<div id="picker" hidden>
  <div class="row">
    <h2>Where are you?</h2>
    <span style="flex:1"></span>
    <button class="btn" id="closePicker" type="button">Done</button>
  </div>
  <div class="row">
    <button class="btn" id="geoBtn" type="button">Use this car's location</button>
    <span id="geoStatus"></span>
  </div>
  <div id="cities"></div>
</div>

<div id="red" hidden></div>
<script type="module" src="stars.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
