<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Fractal Explorer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8eaed; font: 16px system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
         background: rgba(15, 17, 21, .78); border: 1px solid #2a2f37; border-radius: 16px; padding: 8px; }
  button { font: inherit; font-size: 22px; min-width: 56px; height: 52px; border-radius: 12px; border: 0; background: #262b33; color: #fff; }
  button:active { background: #3a414c; }
  #iters { font-size: 16px; padding: 0 14px; }
  #info { position: fixed; top: 10px; right: 12px; font-size: 13px; color: #aab; background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 8px; }
  #error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">Starting…</div>
<div class="bar">
  <button id="zoomOut" aria-label="Zoom out">−</button>
  <button id="zoomIn" aria-label="Zoom in">+</button>
  <button id="iters">256 iter</button>
  <button id="reset" aria-label="Reset view">⟲</button>
</div>
<div id="error" hidden></div>
<script src="main.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
