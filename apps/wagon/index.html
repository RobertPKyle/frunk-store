<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wagon Trail 1848</title>
<style>
  :root {
    --paper: #f1e6cc;
    --paper-deep: #e4d4b0;
    --card: #fbf5e6;
    --ink: #33261a;
    --soft: #6e5a44;
    --line: #cdb88f;
    --rust: #a3442a;
    --rust-deep: #7f321e;
    --sage: #4f7a3c;
    --warn: #b0331f;
    --focus: #1f6fb2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    color: var(--ink);
    background: var(--paper);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  h1, h2, h3, .serif { font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
  h2 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 8px; }
  button {
    font: inherit; color: inherit; touch-action: manipulation; cursor: pointer;
    min-height: 48px; padding: 6px 14px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line);
  }
  button:active { transform: translateY(1px); }
  button:disabled, button.off { opacity: .45; cursor: default; }
  button.primary { background: var(--rust); border-color: var(--rust-deep); color: #fff8ec; font-weight: 600; }
  button:focus-visible, .padlit { outline: 3px solid var(--focus) !important; outline-offset: 2px; }
  button small { display: block; font-size: 13px; opacity: .8; font-weight: 400; }
  [hidden] { display: none !important; }
  input[type=text] {
    font: inherit; color: inherit; width: 100%; min-height: 46px; padding: 6px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    -webkit-user-select: text; user-select: text;
  }

  #start { height: 100%; }
  .view { height: 100%; overflow-y: auto; padding: 64px 16px 16px; }
  .narrow { max-width: 720px; margin: 0 auto; }
  .stack { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > button { flex: 1 1 auto; }
  .note { color: var(--soft); font-size: 15px; }

  /* title */
  #title { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 40px; }
  #title h1 { margin: 6px 0 2px; font-size: clamp(34px, 7vw, 60px); letter-spacing: .5px; }
  #title .tag { color: var(--soft); margin-bottom: 18px; max-width: 34em; }
  #title .stack { width: min(420px, 100%); }
  #titleArt { width: min(360px, 80vw); height: auto; }

  .pick { text-align: left; padding: 10px 14px; }
  .pick b { font-size: 18px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
  .names { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .names label { font-size: 14px; color: var(--soft); display: grid; gap: 3px; }

  /* store */
  .storeHead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .money { font-size: 20px; font-weight: 700; }
  .goods { display: grid; gap: 6px; margin: 8px 0 10px; }
  .good { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 4px 12px; }
  .good .what b { display: block; }
  .good .what span { font-size: 13px; color: var(--soft); }
  .good .qty { min-width: 4.2em; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .good button { min-width: 52px; font-size: 22px; padding: 0 8px; }
  .advice { background: var(--paper-deep); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  .total { font-size: 18px; font-weight: 600; }

  /* trail */
  #trail { padding: 0; display: grid; grid-template-rows: minmax(140px, 1fr) auto auto auto auto; overflow: hidden; }
  #scene { width: 100%; height: 100%; display: block; min-height: 0; }
  #strip { position: relative; height: 34px; margin: 4px 16px 0; }
  #strip .line { position: absolute; left: 0; right: 0; top: 15px; height: 4px; background: var(--line); border-radius: 2px; }
  #strip .done { position: absolute; left: 0; top: 15px; height: 4px; background: var(--rust); border-radius: 2px; }
  #strip .dot { position: absolute; top: 11px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--card); border: 2px solid var(--soft); }
  #strip .dot.past { background: var(--rust); border-color: var(--rust-deep); }
  #strip .dot.fort { border-radius: 2px; }
  #strip .dot.river { background: #7fb0d6; }
  #strip .me { position: absolute; top: 4px; width: 22px; height: 26px; margin-left: -11px; }
  #strip .lbl { position: absolute; top: 24px; font-size: 11px; white-space: nowrap; transform: translateX(-50%); color: var(--soft); }
  #status { display: grid; grid-template-columns: repeat(6, auto); justify-content: space-between; gap: 2px 14px; padding: 6px 16px 2px; font-size: 15px; }
  #status div span { display: block; font-size: 12px; color: var(--soft); text-transform: uppercase; letter-spacing: .4px; }
  #status div b { font-weight: 600; white-space: nowrap; }
  #status .bad { color: var(--warn); }
  #msg { padding: 4px 16px; min-height: 30px; font-size: 15px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel { padding: 0 12px 10px; }
  .acts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .acts button { padding: 4px 6px; line-height: 1.15; }
  .acts .primary { grid-column: span 2; }
  .lede { margin: 2px 4px 8px; font-size: 16px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px; }
  .opts button { text-align: left; line-height: 1.2; }

  /* sheets */
  .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(40, 28, 16, .55); display: flex; align-items: center; justify-content: center; padding: 12px; }
  .sheet { width: min(640px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .sheet.wide { width: min(900px, 100%); }
  .sheet .body { margin-bottom: 12px; font-size: 17px; }
  .sheet .body p { margin-bottom: 8px; }
  .sheet .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .sheet .btns button { min-width: 120px; }
  .people { display: grid; gap: 6px; margin-bottom: 10px; }
  .person { display: grid; grid-template-columns: 1fr 120px auto; gap: 10px; align-items: center; }
  .bar { height: 10px; background: var(--paper-deep); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--sage); }
  .bar i.low { background: #c08a2a; }
  .bar i.vlow { background: var(--warn); }
  .dead { color: var(--soft); text-decoration: line-through; }
  .kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 4px 16px; }
  .kit div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 3px 0; }
  table.score { width: 100%; border-collapse: collapse; }
  table.score td { padding: 4px 2px; border-bottom: 1px solid var(--line); }
  table.score td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .say { font-style: italic; }
  #map { width: 100%; height: auto; display: block; }

  /* the end */
  #end { text-align: center; }
  #end .narrow { text-align: left; }

  /* hunting */
  #hunt { position: fixed; inset: 0; background: #9cbf68; }
  #hunt canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #huntHud { position: absolute; top: 10px; right: 140px; padding: 8px 12px; background: rgba(30, 22, 14, .72); color: #fff8ec; border-radius: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #huntDone { position: absolute; top: 6px; right: 10px; min-width: 116px; }
  #huntTip { position: absolute; left: 12px; bottom: 10px; max-width: 40%; padding: 6px 10px; background: rgba(30, 22, 14, .6); color: #fff8ec; border-radius: 8px; font-size: 14px; }

  @media (max-width: 700px) {
    #status { grid-template-columns: repeat(3, auto); }
    .acts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .acts .primary { grid-column: span 3; }
    #huntHud { right: auto; left: 110px; top: 60px; }
  }
  @media (max-height: 520px) {
    #status { font-size: 14px; }
    #status div span { display: none; }
  }
</style>
</head>
<body>
  <main id="start">
    <section id="title" class="view">
      <svg id="titleArt" viewBox="0 0 360 150" aria-hidden="true">
        <path d="M0 120 Q90 100 180 112 T360 108 V150 H0Z" fill="#c9b27f"/>
        <path d="M0 98 L60 60 L95 84 L150 40 L210 92 L250 66 L300 90 L360 70 V124 H0Z" fill="#b8a07a" opacity=".55"/>
        <ellipse cx="292" cy="38" rx="16" ry="16" fill="#f0c66a"/>
        <g transform="translate(150 118)">
          <path d="M-46 -38 C-50 -80 -30 -86 4 -86 C38 -86 56 -80 54 -38Z" fill="#fbf5e6" stroke="#cdb88f" stroke-width="2"/>
          <rect x="-42" y="-40" width="92" height="20" fill="#7a5332"/>
          <circle cx="30" cy="-14" r="18" fill="none" stroke="#3b2a1a" stroke-width="3"/>
          <circle cx="-26" cy="-12" r="14" fill="none" stroke="#3b2a1a" stroke-width="3"/>
          <path d="M30 -32 V4 M12 -14 H48 M-26 -26 V2 M-40 -12 H-12" stroke="#3b2a1a" stroke-width="2"/>
          <ellipse cx="-92" cy="-26" rx="24" ry="12" fill="#8a5d3b"/>
          <ellipse cx="-118" cy="-30" rx="9" ry="7" fill="#8a5d3b"/>
          <path d="M-104 -16 V0 M-84 -16 V0 M-74 -16 V0 M-98 -16 V0" stroke="#6b4a30" stroke-width="4" stroke-linecap="round"/>
          <path d="M-42 -14 L-80 -22" stroke="#4a3624" stroke-width="3"/>
        </g>
      </svg>
      <h1>Wagon Trail 1848</h1>
      <p class="tag">Lead a family 2,000 miles west by ox wagon, from the Missouri River to the Willamette Valley. Buy supplies, ford rivers, hunt, and beat the snow.</p>
      <div class="stack">
        <button id="continue" class="primary" type="button" hidden></button>
        <button id="newBtn" type="button">New journey</button>
        <div class="row">
          <button id="howBtn" type="button">How to play</button>
          <button id="bestBtn" type="button">Best journeys</button>
        </div>
      </div>
    </section>

    <section id="setup" class="view" hidden>
      <div class="narrow" id="setupBox"></div>
    </section>

    <section id="store" class="view" hidden>
      <div class="narrow">
        <div class="storeHead">
          <h2 id="storeName"></h2>
          <div class="money" id="storeMoney"></div>
        </div>
        <p class="advice" id="storeAdvice"></p>
        <div class="goods" id="goods"></div>
        <div class="row">
          <div class="total" id="storeTotal" style="flex:1"></div>
          <button id="storeCancel" type="button">Leave without buying</button>
          <button id="storeBuy" class="primary" type="button">Buy</button>
        </div>
      </div>
    </section>

    <section id="trail" class="view" hidden>
      <canvas id="scene"></canvas>
      <div id="strip"></div>
      <div id="status"></div>
      <div id="msg"></div>
      <div id="panel"></div>
    </section>

    <section id="end" class="view" hidden>
      <div class="narrow" id="endBox"></div>
    </section>
  </main>

  <section id="hunt" hidden>
    <canvas></canvas>
    <div id="huntHud"></div>
    <button id="huntDone" type="button">Stop hunting</button>
    <div id="huntTip"></div>
  </section>

  <div id="dialog" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 id="dlgTitle"></h2>
      <div class="body" id="dlgBody"></div>
      <div class="btns" id="dlgBtns"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script src="/sw-register.js"></script>
</body>
</html>
