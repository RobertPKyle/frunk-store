<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Planes Overhead</title>
<link rel="stylesheet" href="maplibre/maplibre-gl.css">
<style>
  @font-face { font-family: "B612"; src: url(fonts/b612-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "B612"; src: url(fonts/b612-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "B612 Mono"; src: url(fonts/b612-mono-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "B612 Mono"; src: url(fonts/b612-mono-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }

  :root {
    --chart: #14293a; --panel: #0f2132; --raised: #18324a; --line: rgba(165, 214, 240, .2);
    --text: #e9f2f8; --muted: #9ab2c4;
    --low: #ff7cc0; --mid: #ffc65c; --high: #a5e6ff; --alert: #ff6a5e; --band: var(--high);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--chart); color: var(--text); font: 15px/1.35 "B612", system-ui, sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--high); outline-offset: 1px; }
  .btn { min-height: 44px; min-width: 44px; padding: 8px 12px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line); white-space: nowrap; }

  .app { display: grid; grid-template-columns: 1fr 280px; height: 100%; }
  .main { position: relative; min-width: 0; }
  #map, #air { position: absolute; inset: 0; width: 100%; height: 100%; }
  #air { pointer-events: none; }

  .zoom { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; }
  .zoom .btn { width: 48px; height: 48px; padding: 0; font-size: 22px; background: rgba(15, 33, 50, .9); }

  /* What the plane colors mean */
  #legend { position: absolute; left: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-radius: 8px; background: rgba(15, 33, 50, .88); font-size: 12px; pointer-events: none; }
  #legend span { display: flex; align-items: center; gap: 7px; }
  #legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--band); flex: none; }

  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
  .head { display: flex; gap: 6px; padding: 8px; }
  .head[hidden] { display: none; }
  #placeBtn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  #summary { padding: 0 12px 2px; font-size: 14px; }
  #status { padding: 0 12px 6px; font-size: 13px; color: var(--muted); }
  #status.bad { color: var(--mid); }
  #status:empty { display: none; }

  #list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 8px 8px; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; width: 100%; min-height: 52px; padding: 7px 10px; margin-bottom: 4px; text-align: left; border: 0; border-left: 4px solid var(--band); border-radius: 3px 8px 8px 3px; background: var(--raised); }
  .row[hidden] { display: none; }
  .row b, .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row b { font-weight: 700; }
  .row .alt, .row .far { font-size: 13px; text-align: right; }
  .row .type, .row .far { font-size: 13px; color: var(--muted); }
  #empty { padding: 10px 12px; color: var(--muted); font-size: 14px; }
  #empty:empty { display: none; }

  #detail { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 12px; }
  #detail[hidden] { display: none; }
  #detail h1 { margin: 6px 0 0; font-size: 24px; line-height: 1.15; color: var(--band); overflow-wrap: anywhere; }
  .kind { margin: 2px 0 0; }
  .ids { margin: 2px 0 12px; font-size: 13px; color: var(--muted); }
  .route { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 6px; padding: 10px 0; margin-bottom: 12px; border-block: 1px solid var(--line); }
  .route strong { display: block; font: 700 26px/1.1 "B612 Mono", monospace; }
  .route small { display: block; font-size: 12px; color: var(--muted); overflow-wrap: break-word; }
  .route div:last-child { text-align: right; }
  .route svg { width: 28px; height: 28px; margin-top: 1px; color: var(--muted); }
  .noroute { margin: 0 0 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .look { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; margin-bottom: 12px; }
  .look svg { width: 84px; height: 84px; display: block; }
  .look p { margin: 0; }
  dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin: 0; }
  dt { font-size: 12px; color: var(--muted); }
  dd { margin: 0; }
  .alarm { margin: 0 0 12px; padding: 8px 10px; border-radius: 8px; background: rgba(255, 106, 94, .16); color: var(--alert); font-weight: 700; }
  .gone { margin: 0 0 12px; color: var(--mid); font-size: 14px; }
  .fine { margin: 12px 0 0; font-size: 12px; color: var(--muted); }

  footer { padding: 6px 10px 8px; font-size: 10.5px; line-height: 1.3; color: var(--muted); border-top: 1px solid var(--line); }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <div id="map"></div>
    <canvas id="air" aria-hidden="true"></canvas>
    <div class="zoom">
      <button class="btn" id="inBtn" type="button" aria-label="Zoom in">+</button>
      <button class="btn" id="outBtn" type="button" aria-label="Zoom out">−</button>
      <button class="btn" id="youBtn" type="button" aria-label="Center the map on you">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <div id="legend"></div>
  </div>
  <aside>
    <div class="head" id="head">
      <button class="btn" id="placeBtn" type="button">Set location</button>
      <button class="btn" id="hereBtn" type="button">Here</button>
      <button class="btn" id="unitsBtn" type="button">mi</button>
    </div>
    <div class="head" id="detailHead" hidden><button class="btn" id="backBtn" type="button">All planes</button></div>
    <div id="summary" aria-live="polite">Finding planes…</div>
    <div id="status"></div>
    <div id="list"><div id="empty"></div></div>
    <section id="detail" hidden></section>
    <footer>Flights from adsb.lol (ODbL). Routes and aircraft from adsbdb. Map from OpenFreeMap, OpenMapTiles and OpenStreetMap contributors.</footer>
  </aside>
</div>
<script type="module" src="planes.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
