<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; color: #e8eaed; font: 18px system-ui, sans-serif; overflow: hidden; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  /* left padding keeps clear of the hub's Apps button */
  #hud { position: fixed; top: 16px; left: 0; right: 0; padding-left: 110px; display: flex; gap: 20px; font-size: 16px; color: #aab3c2; pointer-events: none; }
  #hud b { color: #fff; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; pointer-events: none; font-size: 28px; font-weight: 600; text-shadow: 0 2px 12px #000; }
  #msg small { display: block; font-size: 17px; font-weight: 400; color: #aab3c2; margin-top: 8px; }
  button { font: inherit; font-size: 15px; min-height: 44px; padding: 0 12px; color: #c8cfda; background: rgba(20, 24, 32, .85); border: 1px solid #2f3540; border-radius: 10px; }
  #btns { position: fixed; top: 4px; right: 6px; display: flex; gap: 6px; }
  @media (max-width: 600px) { #hud { top: 56px; padding-left: 0; justify-content: center; gap: 14px; font-size: 14px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span>Score <b id="score">0</b></span>
  <span>Lives <b id="lives">3</b></span>
  <span>Level <b id="level">1</b></span>
  <span>Best <b id="best">0</b></span>
</div>
<div id="msg"></div>
<div id="btns">
  <button id="newBtn" type="button" hidden>New game</button>
  <button id="pauseBtn" type="button" hidden>Pause</button>
  <button id="soundBtn" type="button">Sound on</button>
</div>
<script src="game.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
