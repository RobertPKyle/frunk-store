<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brick Breaker</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; color: #e8eaed; font: 18px system-ui, sans-serif; overflow: hidden; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; top: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; font-size: 16px; color: #aab3c2; pointer-events: none; }
  #hud b { color: #fff; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; font-size: 28px; font-weight: 600; text-shadow: 0 2px 12px #000; }
  #msg small { display: block; font-size: 17px; font-weight: 400; color: #aab3c2; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span>Score <b id="score">0</b></span>
  <span>Lives <b id="lives">3</b></span>
  <span>Level <b id="level">1</b></span>
  <span>Best <b id="best">0</b></span>
</div>
<div id="msg"></div>
<script src="game.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
