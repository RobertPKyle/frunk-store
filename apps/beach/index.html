<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Beach Conditions</title>
<style>
  @font-face { font-family: "Bowlby One"; src: url(fonts/bowlby-one-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Cabin; src: url(fonts/cabin-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: Cabin; src: url(fonts/cabin-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }

  :root {
    --tower: #0e2f3b; --plank: #1b4757; --line: rgba(214, 240, 240, .2);
    --foam: #f6fbf8; --haze: #b4d0d3; --buoy: #f6c516; --ink: #10303c; --flag: #c5281f;
    --sky-ink: #10303c; --sand-ink: #3a2f17;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--tower); color: var(--foam); font: 500 16px/1.3 Cabin, "Trebuchet MS", sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--buoy); outline-offset: 2px; }
  [hidden] { display: none !important; }
  p, h1, h2 { margin: 0; }

  .app { display: grid; grid-template-columns: 1fr 226px; grid-template-rows: 1fr auto; height: 100%; }

  /* The picture is the readout: each number sits on the thing it measures */
  #scene { position: relative; overflow: hidden; min-width: 0; min-height: 0; contain: strict; }
  .wave { position: absolute; left: 0; width: calc(100% + var(--L) * 2); height: var(--tile); background-repeat: repeat-x; will-change: transform; animation: roll var(--T) linear infinite; }
  @keyframes roll { from { transform: translate3d(calc(var(--L) * -1), 0, 0); } to { transform: translate3d(0, 0, 0); } }
  #deep { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; }
  .float { position: absolute; z-index: 2; will-change: transform; animation: bob calc(var(--T) / 2) cubic-bezier(.37, 0, .63, 1) infinite alternate; }
  .float svg { display: block; }
  @keyframes bob { from { transform: translate3d(0, calc(var(--A) * -1), 0); } to { transform: translate3d(0, var(--A), 0); } }
  #shore { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
  #shore text { font: 700 12px Cabin, sans-serif; }

  #skyText { position: absolute; z-index: 5; left: 0; top: 0; right: 15%; padding: 54px 14px 0; color: var(--sky-ink); }
  h1 { font: 400 25px/1.08 "Bowlby One", Impact, sans-serif; overflow-wrap: anywhere; }
  #where { font-size: 14px; margin-top: 2px; }
  #air { display: flex; flex-wrap: wrap; gap: 0 16px; margin-top: 5px; font-size: 15px; }
  #air b { font-weight: 700; }
  #air span { white-space: nowrap; }
  #alertNote { margin-top: 3px; font-size: 14px; }
  #pickBeach { margin-top: 6px; min-height: 44px; padding: 6px 14px; border-radius: 8px; border: 0; background: var(--tower); color: var(--foam); font-weight: 700; }

  #alertBtn { display: flex; align-items: center; gap: 9px; margin-top: 7px; min-height: 44px; max-width: 100%; padding: 5px 12px 5px 8px; border: 0; border-radius: 8px; background: var(--flag); color: #fff; font-weight: 700; text-align: left; }
  /* The surf lifesaving flag */
  .flag { flex: none; width: 24px; height: 18px; background: linear-gradient(#e8362b 50%, #ffd21f 50%); border: 1px solid rgba(255, 255, 255, .7); }

  #waterText { position: absolute; z-index: 5; left: 14px; bottom: 8px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px; align-items: center; color: var(--foam); text-shadow: 0 1px 2px rgba(3, 30, 40, .5); }
  .reading { display: contents; }
  .big { font: 400 40px/1 "Bowlby One", Impact, sans-serif; white-space: nowrap; }
  .none { font: 700 16px/1.15 Cabin, sans-serif; white-space: normal; max-width: 92px; }
  .reading p { font-size: 15px; line-height: 1.18; font-weight: 700; }
  .reading small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; line-height: 1.15; }

  #sandText { position: absolute; z-index: 5; right: 8px; bottom: 8px; color: var(--sand-ink); font-size: 13.5px; line-height: 1.2; }
  #sandText b { display: block; font-weight: 700; font-size: 16px; }
  #sandText small { display: block; font-size: 13px; }

  #status { position: absolute; z-index: 6; left: 14px; right: 14px; top: 40%; text-align: center; font-size: 20px; font-weight: 700; color: var(--sky-ink); }
  #status button { display: block; margin: 12px auto 0; min-height: 44px; padding: 6px 18px; border: 0; border-radius: 8px; background: var(--tower); color: var(--foam); font-weight: 700; }

  #alertBox { position: absolute; z-index: 7; inset: 8px; display: flex; flex-direction: column; border-radius: 10px; background: var(--foam); color: var(--ink); box-shadow: 0 6px 24px rgba(0, 0, 0, .45); }
  #alertBody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px; white-space: pre-line; font-size: 15px; }
  #alertBody h2 { font-size: 19px; margin: 0 0 4px; }
  #alertBody h2:not(:first-child) { margin-top: 16px; }
  #alertClose { flex: none; min-height: 48px; margin: 0 10px 10px; border: 0; border-radius: 8px; background: var(--tower); color: var(--foam); font-weight: 700; }

  /* The lifeguard's board: where you are, and which reading the picture shows */
  aside { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .head { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 7px; }
  .btn { min-height: 44px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--plank); white-space: nowrap; }
  #placeBtn { grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  #rows { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); }
  .row { display: block; width: 100%; min-height: 56px; padding: 7px 10px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
  .row b { display: block; font-weight: 700; font-size: 15px; line-height: 1.15; overflow-wrap: anywhere; }
  .row span { display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; color: var(--haze); font-size: 13px; }
  .row i { font-style: normal; }
  .row[aria-pressed="true"] { background: var(--buoy); color: var(--ink); }
  .row[aria-pressed="true"] span { color: var(--ink); }

  footer { grid-column: 1 / -1; padding: 4px 10px 5px; font-size: 11px; line-height: 1.22; color: var(--haze); border-top: 1px solid var(--line); }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 66%) minmax(0, 1fr) auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    #skyText { right: 64px; }
    .big { font-size: 34px; }
    .reading p { font-size: 13px; }
    .reading small { font-size: 12px; }
    #sandText { font-size: 12px; }
    #sandText b { font-size: 14px; }
    #sandText small { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave, .float { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <main id="scene">
    <div id="deep"></div>
    <svg id="shore" aria-hidden="true"></svg>
    <div id="skyText" aria-live="polite">
      <h1 id="title"></h1>
      <p id="where"></p>
      <div id="air"></div>
      <p id="alertNote"></p>
      <button id="pickBeach" type="button" hidden>Pick a beach</button>
      <button id="alertBtn" type="button" hidden><span class="flag"></span><span id="alertWords"></span></button>
    </div>
    <div id="waterText" hidden aria-live="polite">
      <div class="reading"><b class="big" id="waterBig"></b><p><span id="waterWords"></span><small id="waterFrom"></small></p></div>
      <div class="reading"><b class="big" id="waveBig"></b><p><span id="waveWords"></span><small id="waveFrom"></small></p></div>
    </div>
    <div id="sandText"></div>
    <div id="status"></div>
    <div id="alertBox" role="dialog" aria-label="Beach alerts" hidden>
      <div id="alertBody"></div>
      <button id="alertClose" type="button">Close</button>
    </div>
  </main>
  <aside>
    <div class="head">
      <button class="btn" id="placeBtn" type="button">Set location</button>
      <button class="btn" id="hereBtn" type="button">Here</button>
      <button class="btn" id="tempBtn" type="button">°F</button>
      <button class="btn" id="unitsBtn" type="button">mi</button>
    </div>
    <div id="rows"></div>
  </aside>
  <footer>Readings from NOAA's National Data Buoy Center and partners. Waves from CDIP, Scripps (cdip.ucsd.edu). Tides from NOAA. Buoys sit offshore, so waves at the beach can differ. Not a safety service: follow lifeguards and posted flags.</footer>
</div>
<script type="module" src="beach.js"></script>
<script src="/sw-register.js"></script>
</body>
</html>
